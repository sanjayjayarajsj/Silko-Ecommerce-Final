<div class="dialog-overlay">

  <div class="dialog-box">

    <h2>{{ title }}</h2>

    <p>{{ message }}</p>

    <div class="dialog-actions">
      <button class="cancel-btn" (click)="cancel()">
        Cancel
      </button>

      <button class="confirm-btn" (click)="confirm()">
        Confirm
      </button>
    </div>

  </div>

</div>
