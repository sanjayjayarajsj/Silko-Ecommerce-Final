<div class="product-card">

  <a
    [routerLink]="['/products', product().id]"
    class="image-link"
  >
    <div class="image-container">

      <img
        [src]="product().image"
        [alt]="product().name"
        (error)="handleImageError($event)"
      >

<button
  type="button"
  class="wishlist-btn"
  (click)="addProductToWishlist($event)"
  aria-label="Add to wishlist">
  <svg viewBox="0 0 24 24" width="18" height="18">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
      d="M12 21s-7.5-4.6-10-9.1C.5 8.4 2.3 5 5.7 5c2 0 3.4 1 4.3 2.4C10.9 6 12.3 5 14.3 5c3.4 0 5.2 3.4 3.7 6.9C19.5 16.4 12 21 12 21z"/>
  </svg>
</button>

    </div>
  </a>

  <div class="product-info">

    <p class="brand">
      {{ product().brand }}
    </p>

    <h3>
      {{ product().name }}
    </h3>

    <div class="rating">
      @for (star of ratingStars; track star) {
        <span [class.filled]="star <= rating">★</span>
      }
      <span class="review-count">({{ reviewCount }})</span>
    </div>

    <div class="bottom">

      <span class="price">
        ₹{{ product().price }}
      </span>

<button
  class="cart-btn"
  (click)="addToCart()"> Add to Cart</button>
    </div>

    <button class="buy-now-btn" (click)="buyNow($event)">Buy Now</button>
  </div>
</div>
