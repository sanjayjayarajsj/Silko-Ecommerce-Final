<nav
  class="navbar"
  [class.scrolled]="scrolled"
  [class.over-hero]="overHero()"
  [class.nav-hidden]="hidden"
>

  <!-- Logo -->
  <a routerLink="/" class="logo">

    <svg
      class="logo-mark"
      viewBox="0 0 24 24"
      width="22"
      height="22"
      aria-hidden="true"
    >
      <circle
        cx="12"
        cy="12"
        r="9"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
      />

      <line
        x1="12"
        y1="12"
        x2="12"
        y2="7"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
      />

      <line
        x1="12"
        y1="12"
        x2="15.5"
        y2="13.5"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
      />
    </svg>

    <span>SILKO</span>

  </a>


  <!-- Search -->
  <div class="search-inline">

    <svg
      viewBox="0 0 24 24"
      width="16"
      height="16"
      aria-hidden="true"
    >
      <circle
        cx="11"
        cy="11"
        r="7"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      />

      <line
        x1="21"
        y1="21"
        x2="16.65"
        y2="16.65"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>

    <input
      type="text"
      placeholder="Search products..."
      [(ngModel)]="searchText"
      (keyup.enter)="search()"
    >

  </div>


  <!-- Navigation -->
  <div class="nav-icons">

    <!-- Wishlist -->
    <a
      routerLink="/wishlist"
      routerLinkActive="active-link"
      class="nav-link-text"
      aria-label="Wishlist"
    >

      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        aria-hidden="true"
      >
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
          d="M12 21s-7.5-4.6-10-9.1C.5 8.4 2.3 5 5.7 5c2 0 3.4 1 4.3 2.4C10.9 6 12.3 5 14.3 5c3.4 0 5.2 3.4 3.7 6.9C19.5 16.4 12 21 12 21z"
        />
      </svg>

      <span class="nav-text">WISHLIST</span>

      @if ((wishlistCount | async); as count) {
        @if (count > 0) {
          <span class="count-badge">{{ count }}</span>
        }
      }

    </a>


    <!-- Cart -->
    <a
      routerLink="/cart"
      routerLinkActive="active-link"
      class="nav-link-text"
      aria-label="Cart"
    >

      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        aria-hidden="true"
      >
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 6h15l-1.5 9h-12z"
        />

        <path
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          d="M6 6L4.5 2H2 M9 10v4 M13.5 10v4"
        />

        <circle
          cx="9.5"
          cy="19"
          r="1.4"
          fill="currentColor"
        />

        <circle
          cx="17"
          cy="19"
          r="1.4"
          fill="currentColor"
        />
      </svg>

      <span class="nav-text">CART</span>

      @if ((cartCount | async); as count) {
        @if (count > 0) {
          <span class="count-badge">{{ count }}</span>
        }
      }

    </a>


    <!-- Contact -->
    <a
      routerLink="/home"
      fragment="contact"
      routerLinkActive="active-link"
      class="nav-link-text"
    >
      <span class="nav-text">CONTACT US</span>
    </a>


    <!-- Account -->
    <button
      type="button"
      class="icon-btn"
      (click)="showAccount = !showAccount"
      aria-label="Account"
      [attr.aria-expanded]="showAccount"
    >

      <svg
        viewBox="0 0 24 24"
        width="20"
        height="20"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="8"
          r="4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        />

        <path
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"
        />
      </svg>

    </button>


    <!-- Account Dropdown -->
    @if (showAccount) {

      <div class="account-menu">

        @if (isLoggedIn()) {

          <a
            routerLink="/profile"
            (click)="showAccount = false"
          >
            My Profile
          </a>

          <a
            routerLink="/order"
            (click)="showAccount = false"
          >
            My Orders
          </a>

          <button
            type="button"
            (click)="logout()"
          >
            Logout
          </button>

        } @else {

          <a
            routerLink="/login"
            (click)="showAccount = false"
          >
            Login
          </a>

          <a
            routerLink="/register"
            (click)="showAccount = false"
          >
            Register
          </a>

        }

      </div>

    }

  </div>

</nav>
