<div class="admin-shell">

  <aside class="admin-sidebar">

    <div class="admin-brand">
      <span class="admin-brand-mark">S</span>
      <span>Silko Admin</span>
    </div>

    <nav class="admin-nav">

      <a routerLink="/admin/dashboard" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            d="M4 13h6V4H4v9zM14 20h6v-9h-6v9zM14 4v4h6V4h-6zM4 20h6v-4H4v4z"/>
        </svg>
        Dashboard
      </a>

      <a routerLink="/admin/products" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>
        </svg>
        Products
      </a>

      <a routerLink="/admin/orders" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            d="M6 6h15l-1.5 9h-12z"/>
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            d="M6 6L4.5 2H2 M9 10v4 M13.5 10v4"/>
          <circle cx="9.5" cy="19" r="1.4" fill="currentColor"/>
          <circle cx="17" cy="19" r="1.4" fill="currentColor"/>
        </svg>
        Orders
      </a>

      <a routerLink="/admin/users" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Users
      </a>

    </nav>

    <button class="admin-logout" (click)="logout()">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
      Logout
    </button>

  </aside>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>

</div>
