<section class="auth-page">

  <div class="auth-box">

    <h1>Create Account</h1>

    <p>Join our watch collection</p>

    <form (ngSubmit)="register()">

      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Username"
        required
      >

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Register
      </button>

    </form>

    <p>
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>

</section>
